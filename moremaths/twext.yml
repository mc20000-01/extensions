blocks:
  - blockType: label
    text: "Constants"
  - opcode: constantPi
    blockType: reporter
    text: "pi (π)"
    disableMonitor: true
  - opcode: constantE
    blockType: reporter
    text: "e (euler's number)"
    disableMonitor: true
  - opcode: constantTau
    blockType: reporter
    text: "tau (τ = 2π)"
    disableMonitor: true
  - opcode: constantPhi
    blockType: reporter
    text: "phi (φ, golden ratio)"
    disableMonitor: true
  - opcode: constantSqrt2
    blockType: reporter
    text: "square root of 2 (√2)"
    disableMonitor: true
  - opcode: mathConstant
    blockType: reporter
    text: "math constant [CONSTANT]"
    arguments:
      CONSTANT:
        type: string
        defaultValue: "pi"
        menu: constant
  - blockType: label
    text: "Rounding & Signs"
  - opcode: roundNumber
    blockType: reporter
    text: "round [NUM] to the nearest whole number"
    arguments:
      NUM:
        type: number
        defaultValue: 1.5
  - opcode: floorNumber
    blockType: reporter
    text: "floor [NUM]"
    arguments:
      NUM:
        type: number
        defaultValue: 1.7
  - opcode: ceilingNumber
    blockType: reporter
    text: "ceiling [NUM]"
    arguments:
      NUM:
        type: number
        defaultValue: 1.2
  - opcode: truncateNumber
    blockType: reporter
    text: "truncate [NUM] (drop the decimals)"
    arguments:
      NUM:
        type: number
        defaultValue: 1.7
  - opcode: roundToPlaces
    blockType: reporter
    text: "round [NUM] to [PLACES] decimal places"
    arguments:
      NUM:
        type: number
        defaultValue: 3.14159
      PLACES:
        type: number
        defaultValue: 2
  - opcode: roundHalfDown
    blockType: reporter
    text: "round [NUM] to [PLACES] places, .5 rounds down"
    arguments:
      NUM:
        type: number
        defaultValue: 2.5
      PLACES:
        type: number
        defaultValue: 0
  - opcode: roundHalfEven
    blockType: reporter
    text: "round [NUM] to [PLACES] places, .5 rounds to even"
    arguments:
      NUM:
        type: number
        defaultValue: 2.5
      PLACES:
        type: number
        defaultValue: 0
  - opcode: roundToSignificant
    blockType: reporter
    text: "round [NUM] to [FIGURES] significant figures"
    arguments:
      NUM:
        type: number
        defaultValue: 1234.5678
      FIGURES:
        type: number
        defaultValue: 3
  - opcode: roundToMultiple
    blockType: reporter
    text: "round [NUM] to the nearest multiple of [STEP]"
    arguments:
      NUM:
        type: number
        defaultValue: 17
      STEP:
        type: number
        defaultValue: 5
  - opcode: floorToMultiple
    blockType: reporter
    text: "round [NUM] down to a multiple of [STEP]"
    arguments:
      NUM:
        type: number
        defaultValue: 17
      STEP:
        type: number
        defaultValue: 5
  - opcode: ceilingToMultiple
    blockType: reporter
    text: "round [NUM] up to a multiple of [STEP]"
    arguments:
      NUM:
        type: number
        defaultValue: 17
      STEP:
        type: number
        defaultValue: 5
  - opcode: absoluteValue
    blockType: reporter
    text: "absolute value of [NUM]"
    arguments:
      NUM:
        type: number
        defaultValue: -5
  - opcode: signOfNumber
    blockType: reporter
    text: "sign of [NUM] (-1, 0 or 1)"
    arguments:
      NUM:
        type: number
        defaultValue: -5
  - opcode: fractionalPart
    blockType: reporter
    text: "fractional part of [NUM]"
    arguments:
      NUM:
        type: number
        defaultValue: 2.75
  - opcode: decimalPlacesOf
    blockType: reporter
    text: "number of decimal places in [NUM]"
    arguments:
      NUM:
        type: number
        defaultValue: 2.75
  - opcode: absoluteDifference
    blockType: reporter
    text: "absolute difference of [A] and [B]"
    arguments:
      A:
        type: number
        defaultValue: 3
      B:
        type: number
        defaultValue: 10
  - blockType: label
    text: "Trigonometry"
  - opcode: sine
    blockType: reporter
    text: "sin of [ANGLE]°"
    arguments:
      ANGLE:
        type: number
        defaultValue: 30
  - opcode: cosine
    blockType: reporter
    text: "cos of [ANGLE]°"
    arguments:
      ANGLE:
        type: number
        defaultValue: 60
  - opcode: tangent
    blockType: reporter
    text: "tan of [ANGLE]°"
    arguments:
      ANGLE:
        type: number
        defaultValue: 45
  - opcode: secant
    blockType: reporter
    text: "sec of [ANGLE]°"
    arguments:
      ANGLE:
        type: number
        defaultValue: 60
  - opcode: cosecant
    blockType: reporter
    text: "csc of [ANGLE]°"
    arguments:
      ANGLE:
        type: number
        defaultValue: 30
  - opcode: cotangent
    blockType: reporter
    text: "cot of [ANGLE]°"
    arguments:
      ANGLE:
        type: number
        defaultValue: 45
  - opcode: arcSine
    blockType: reporter
    text: "arcsin of [VALUE] in degrees"
    arguments:
      VALUE:
        type: number
        defaultValue: 0.5
  - opcode: arcCosine
    blockType: reporter
    text: "arccos of [VALUE] in degrees"
    arguments:
      VALUE:
        type: number
        defaultValue: 0.5
  - opcode: arcTangent
    blockType: reporter
    text: "arctan of [VALUE] in degrees"
    arguments:
      VALUE:
        type: number
        defaultValue: 1
  - opcode: arcCotangent
    blockType: reporter
    text: "arccot of [VALUE] in degrees (0 to 180)"
    arguments:
      VALUE:
        type: number
        defaultValue: 1
  - opcode: arcTangent2
    blockType: reporter
    text: "arctan2 (y [Y] , x [X]) in degrees"
    arguments:
      Y:
        type: number
        defaultValue: 1
      X:
        type: number
        defaultValue: 1
  - opcode: hyperbolicSine
